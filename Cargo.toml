[package]
name = "fatfs"
version = "0.4.0"
authors = [
    "Rafał Harabień <rafalh92@outlook.com>",
]
edition = "2021"
rust-version = "1.71"
repository = "https://github.com/HypeR-Proj/rust-fatfs"
readme = "README.md"
keywords = [
    "fat",
    "filesystem",
    "no_std",
]
categories = [
    "filesystem",
]
license = "MIT"
description = "FAT filesystem library.\n"
exclude = [
    "resources/*",
]

[features]
std = []
lfn = []
alloc = []
unicode = []
log_level_error = []
log_level_warn = [
    "log_level_error",
]
log_level_info = [
    "log_level_warn",
]
log_level_debug = [
    "log_level_info",
]
log_level_trace = [
    "log_level_debug",
]
default = [
    "chrono",
    "std",
    "alloc",
    "lfn",
    "unicode",
    "log_level_trace",
]

[dependencies.bitflags]
version = "2"
default-features = false

[dependencies.log]
version = "0.4"
default-features = false

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
]
optional = true

[dev-dependencies]
env_logger = "0.9"
fscommon = "0.1"
tempfile = "3.24.0"
